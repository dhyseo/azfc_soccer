<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AZFC 경기 일정 및 참석 투표</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --card-border: #2d2d2d;
      --text-main: #f0f0f0;
      --text-sub: #aaaaaa;
      --primary-color: #3b82f6;
      --success-color: #10b981;
      --success-bg: rgba(16, 185, 129, 0.15);
      --danger-color: #ef4444;
      --danger-bg: rgba(239, 68, 68, 0.15);
      --warning-color: #f59e0b;
      --warning-bg: rgba(245, 158, 11, 0.15);
    }

    * { box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 24px 16px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 640px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 32px 24px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .header-section {
      text-align: center;
      margin-bottom: 28px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--card-border);
    }

    h1 {
      font-size: 26px;
      margin: 0 0 16px 0;
      letter-spacing: -0.5px;
    }

    .user-info {
      font-size: 16px;
      color: var(--text-sub);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .user-name {
      color: var(--primary-color);
      font-weight: 700;
    }

    .btn-logout {
      background-color: #333;
      color: #bbb;
      padding: 6px 12px;
      font-size: 13px;
      border: 1px solid #444;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-logout:hover { background-color: #444; color: #fff; }

    /* 경기 정보 카드 */
    .info-card {
      background-color: #262626;
      border: 1px solid #333;
      padding: 20px;
      border-radius: 14px;
      margin-bottom: 28px;
    }

    .info-item {
      margin: 10px 0;
      font-size: 17px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .info-item:first-child { margin-top: 0; }
    .info-item:last-child { margin-bottom: 0; }

    .info-item strong {
      color: var(--primary-color);
      min-width: 50px;
    }

    /* 대형 투표 버튼 */
    .vote-buttons {
      display: flex;
      gap: 16px;
      margin-bottom: 32px;
    }

    .btn-vote {
      flex: 1;
      padding: 22px 16px;
      font-size: 20px;
      font-weight: 800;
      border-radius: 16px;
      cursor: pointer;
      border: 2px solid transparent;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      background-color: #2a2a2a;
    }

    .btn-attend {
      color: var(--success-color);
      border-color: rgba(16, 185, 129, 0.4);
      background-color: var(--success-bg);
    }
    .btn-attend:hover, .btn-attend.active {
      background-color: var(--success-color);
      color: #ffffff;
      border-color: var(--success-color);
      box-shadow: 0 0 20px rgba(16, 185, 129, 0.4);
      transform: translateY(-2px);
    }

    .btn-absent {
      color: var(--danger-color);
      border-color: rgba(239, 68, 68, 0.4);
      background-color: var(--danger-bg);
    }
    .btn-absent:hover, .btn-absent.active {
      background-color: var(--danger-color);
      color: #ffffff;
      border-color: var(--danger-color);
      box-shadow: 0 0 20px rgba(239, 68, 68, 0.4);
      transform: translateY(-2px);
    }

    /* 투표 현황 리스트 (3열) */
    .results-section {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 32px;
    }

    .result-box {
      background-color: #242424;
      border: 1px solid var(--card-border);
      padding: 16px 12px;
      border-radius: 12px;
      text-align: center;
    }

    .result-box h3 {
      margin: 0 0 12px 0;
      font-size: 15px;
      font-weight: 700;
    }

    .result-box.attend-box h3 { color: var(--success-color); }
    .result-box.absent-box h3 { color: var(--danger-color); }
    .result-box.unvoted-box h3 { color: var(--warning-color); }

    .member-list {
      font-size: 14px;
      color: #ccc;
      line-height: 1.6;
      max-height: 180px;
      overflow-y: auto;
      text-align: center;
      word-break: keep-all;
    }

    /* 관리자 세션 */
    .admin-section {
      padding-top: 24px;
      border-top: 1px dashed var(--card-border);
    }

    .admin-section h3 {
      font-size: 16px;
      color: var(--text-sub);
      margin-bottom: 14px;
      text-align: left;
    }

    .admin-form {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .admin-form input {
      background-color: #181818;
      border: 1px solid #333;
      color: #fff;
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
    }
    .admin-form input:focus { border-color: var(--primary-color); }

    .admin-btn-group {
      display: flex;
      gap: 10px;
    }

    .admin-form button {
      flex: 1;
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      border: none;
      transition: background-color 0.2s;
    }

    .btn-update { background-color: var(--primary-color); color: white; }
    .btn-update:hover { background-color: #2563eb; }

    .btn-reset { background-color: #333; color: var(--danger-color); border: 1px solid var(--danger-color) !important; }
    .btn-reset:hover { background-color: var(--danger-color); color: white; }

    .hidden { display: none !important; }

    @media (max-width: 480px) {
      .results-section {
        grid-template-columns: 1fr;
      }
      .btn-vote {
        padding: 18px 12px;
        font-size: 18px;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header-section">
      <h1>⚽ AZFC 경기 일정 & 투표</h1>
      
      <div id="logged-out-view">
        <p style="color: var(--text-sub); margin-bottom: 16px;">투표에 참여하시려면 구글 계정으로 로그인해 주세요.</p>
        <div id="google-login-btn" style="display: flex; justify-content: center;"></div>
      </div>

      <div id="logged-in-view" class="user-info hidden">
        <span><span id="user-display-name" class="user-name"></span>님 환영합니다!</span>
        <button class="btn-logout" onclick="logout()">로그아웃</button>
      </div>
    </div>

    <div class="info-card">
      <div class="info-item">📅 <strong>일시:</strong> <span id="match-time">불러오는 중...</span></div>
      <div class="info-item">📍 <strong>장소:</strong> <span id="match-location">불러오는 중...</span></div>
    </div>

    <div class="vote-buttons">
      <button id="btn-attend" class="btn-vote btn-attend" onclick="submitVote('참석')">
        <span>참석</span>
      </button>
      <button id="btn-absent" class="btn-vote btn-absent" onclick="submitVote('불참')">
        <span>불참</span>
      </button>
    </div>

    <div class="results-section">
      <div class="result-box attend-box">
        <h3>참석 (<span id="attend-count">0</span>명)</h3>
        <div id="attend-list" class="member-list">-</div>
      </div>
      <div class="result-box absent-box">
        <h3>불참 (<span id="absent-count">0</span>명)</h3>
        <div id="absent-list" class="member-list">-</div>
      </div>
      <div class="result-box unvoted-box">
        <h3>미투표 (<span id="unvoted-count">0</span>명)</h3>
        <div id="unvoted-list" class="member-list">-</div>
      </div>
    </div>

    <div class="admin-section">
      <h3>⚙️ 관리자 메뉴</h3>
      <div class="admin-form">
        <input type="password" id="admin-pw" placeholder="관리자 비밀번호 입력">
        <input type="text" id="new-match-time" placeholder="새 경기 일시 (예: 10월 24일(토) 18:00)">
        <input type="text" id="new-match-loc" placeholder="새 경기 장소 (예: 중앙구장)">
        <div class="admin-btn-group">
          <button class="btn-update" onclick="updateMatchInfo()">경기 일정 변경</button>
          <button class="btn-reset" onclick="resetVotes()">투표 초기화</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const GOOGLE_CLIENT_ID = "77918384297-tbu1ip01281v3m4rqfpj19f8thhclk68.apps.googleusercontent.com";
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzCzx51uUeK7qGl-FDDm7W04j4tgG2BtGfwDufneew-BjLYmFr7Sy1YtPYYB3t5TEuS/exec";

    let currentUserEmail = "";
    let memberMap = {};

    window.onload = function() {
      initGoogleLogin();
      fetchData();
    };

    function initGoogleLogin() {
      if (typeof google === 'undefined' || !google.accounts) {
        setTimeout(initGoogleLogin, 200);
        return;
      }

      google.accounts.id.initialize({
        client_id: GOOGLE_CLIENT_ID,
        callback: handleCredentialResponse,
        use_fedcm_for_prompt: false,
        auto_select: false
      });

      google.accounts.id.renderButton(
        document.getElementById("google-login-btn"),
        { theme: "filled_black", size: "large", type: "standard", shape: "pill", text: "signin_with" }
      );
    }

    function handleCredentialResponse(response) {
      try {
        const responsePayload = parseJwt(response.credential);
        currentUserEmail = (responsePayload.email || "").toLowerCase().trim();
        
        document.getElementById("logged-out-view").classList.add("hidden");
        document.getElementById("logged-in-view").classList.remove("hidden");
        
        updateUserHeaderName();
        fetchData();
      } catch (e) {
        alert("로그인 처리 중 오류가 발생했습니다.");
      }
    }

    function parseJwt(token) {
      const base64Url = token.split('.')[1];
      const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
      const jsonPayload = decodeURIComponent(window.atob(base64).split('').map(function(c) {
          return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
      }).join(''));
      return JSON.parse(jsonPayload);
    }

    function updateUserHeaderName() {
      if (!currentUserEmail) return;
      const displayName = memberMap[currentUserEmail] || (currentUserEmail + " (명단 미등록)");
      document.getElementById("user-display-name").innerText = displayName;
    }

    function logout() {
      currentUserEmail = "";
      document.getElementById("logged-in-view").classList.add("hidden");
      document.getElementById("logged-out-view").classList.remove("hidden");
      document.getElementById("btn-attend").classList.remove("active");
      document.getElementById("btn-absent").classList.remove("active");
    }

    function fetchData() {
      const url = SCRIPT_URL + "?action=getData&t=" + new Date().getTime();
      fetch(url)
        .then(res => res.json())
        .then(data => {
          if (!data.success) {
            console.error("서버 에러:", data.message);
            return;
          }

          document.getElementById("match-time").innerText = data.time || "미정";
          document.getElementById("match-location").innerText = data.location || "미정";

          if (data.members) {
            memberMap = data.members;
            updateUserHeaderName();
          }

          const attendList = data.attendees || [];
          const absentList = data.absentees || [];
          const attendEmails = (data.attendeeEmails || []).map(e => e.toLowerCase().trim());
          const absenteeEmails = (data.absenteeEmails || []).map(e => e.toLowerCase().trim());

          document.getElementById("attend-count").innerText = attendList.length;
          document.getElementById("attend-list").innerText = attendList.join(", ") || "-";

          document.getElementById("absent-count").innerText = absentList.length;
          document.getElementById("absent-list").innerText = absentList.join(", ") || "-";

          const votedEmails = new Set([...attendEmails, ...absenteeEmails]);
          const unvotedList = [];

          for (const email in memberMap) {
            if (!votedEmails.has(email)) {
              unvotedList.push(memberMap[email]);
            }
          }

          document.getElementById("unvoted-count").innerText = unvotedList.length;
          document.getElementById("unvoted-list").innerText = unvotedList.join(", ") || "-";

          if (currentUserEmail) {
            document.getElementById("btn-attend").classList.toggle("active", attendEmails.includes(currentUserEmail));
            document.getElementById("btn-absent").classList.toggle("active", absenteeEmails.includes(currentUserEmail));
          }
        })
        .catch(err => console.error("데이터 불러오기 실패:", err));
    }

    function submitVote(status) {
      if (!currentUserEmail) {
        alert("로그인이 필요합니다.");
        return;
      }

      sendRequest({
        action: "vote",
        email: currentUserEmail,
        status: status
      });
    }

    function updateMatchInfo() {
      const pw = document.getElementById("admin-pw").value;
      const newTime = document.getElementById("new-match-time").value;
      const newLoc = document.getElementById("new-match-loc").value;

      if (!pw || !newTime || !newLoc) {
        alert("비밀번호, 일시, 장소를 모두 입력하세요.");
        return;
      }

      sendRequest({
        action: "updateInfo",
        password: pw,
        time: newTime,
        location: newLoc
      });
    }

    function resetVotes() {
      const pw = document.getElementById("admin-pw").value;
      if (!pw) {
        alert("비밀번호를 입력하세요.");
        return;
      }

      if (confirm("정말로 모든 투표 데이터를 초기화하시겠습니까?")) {
        sendRequest({
          action: "resetVotes",
          password: pw
        });
      }
    }

    function sendRequest(params) {
      params.t = new Date().getTime();
      const queryString = new URLSearchParams(params).toString();
      
      fetch(SCRIPT_URL + "?" + queryString)
        .then(res => res.json())
        .then(res => {
          if (res.success) {
            alert("처리가 완료되었습니다.");
            fetchData();
          } else {
            alert("실패 원인: " + (res.message || "알 수 없는 오류"));
          }
        })
        .catch(err => {
          console.error("통신 오류:", err);
          alert("서버와 통신할 수 없습니다. 배포 권한과 웹앱 URL을 확인하세요.");
        });
    }
  </script>
</body>
</html>
