<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <meta charset="utf-8">
    <style>
      body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        padding: 20px;
        max-width: 500px;
        margin: 0 auto;
      }
      .card {
        border: 1px solid #ddd;
        border-radius: 8px;
        padding: 20px;
        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      }
      .hidden { display: none; }
      .btn-group { margin-top: 20px; }
      button {
        padding: 10px 20px;
        margin-right: 10px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-weight: bold;
      }
      .btn-yes { background-color: #28a745; color: white; }
      .btn-no { background-color: #dc3545; color: white; }
      input[type="email"] {
        width: 100%;
        padding: 8px;
        margin-top: 5px;
        box-sizing: border-box;
      }
      #status-message {
        margin-top: 15px;
        font-size: 14px;
        color: #555;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h2>참석 여부 확인</h2>

      <div id="loading">사용자 정보를 불러오는 중입니다...</div>

      <div id="app-form" class="hidden">
        <p id="email-display"></p>
        
        <!-- 자동 이메일 가져오기 실패 시 직접 입력하는 창 -->
        <div id="manual-email-container" class="hidden">
          <label for="email-input"><strong>이메일 입력:</strong></label>
          <input type="email" id="email-input" placeholder="example@gmail.com">
        </div>

        <div class="btn-group">
          <button class="btn-yes" onclick="submitAttendance('참석')">참석</button>
          <button class="btn-no" onclick="submitAttendance('불참')">불참</button>
        </div>
      </div>

      <p id="status-message"></p>
    </div>

    <script>
      var userEmail = "";

      // 페이지 로드 시 백엔드에서 사용자 이메일 가져오기
      window.onload = function() {
        google.script.run
          .withSuccessHandler(function(email) {
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('app-form').classList.remove('hidden');

            if (email && email.trim() !== "") {
              userEmail = email;
              document.getElementById('email-display').innerHTML = "<strong>계정:</strong> " + email;
            } else {
              // 권한 문제로 이메일을 인식하지 못한 경우
              document.getElementById('email-display').innerText = "자동 이메일 수집을 할 수 없습니다. 이메일을 입력해주세요.";
              document.getElementById('manual-email-container').classList.remove('hidden');
            }
          })
          .withFailureHandler(function(err) {
            document.getElementById('loading').innerText = "초기화 실패: " + err.message;
          })
          .getUserEmail();
      };

      // 참석 / 불참 버튼 클릭 시 전송 처리
      function submitAttendance(status) {
        var emailToSend = userEmail;
        
        if (!emailToSend) {
          emailToSend = document.getElementById('email-input').value.trim();
        }

        if (!emailToSend) {
          alert("이메일을 입력해 주세요.");
          return;
        }

        document.getElementById('status-message').innerText = "서버로 전송 중입니다...";

        google.script.run
          .withSuccessHandler(function(response) {
            if (response.success) {
              alert(response.message);
              document.getElementById('status-message').innerText = response.message;
            } else {
              alert("처리 오류: " + response.message);
              document.getElementById('status-message').innerText = "오류: " + response.message;
            }
          })
          .withFailureHandler(function(error) {
            alert("서버 통신 오류가 발생했습니다: " + error.message);
            document.getElementById('status-message').innerText = "통신 에러. 배포 설정과 권한을 확인하세요.";
          })
          .processAttendance({ email: emailToSend, status: status });
      }
    </script>
  </body>
</html>
