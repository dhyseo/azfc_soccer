<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AZFC 경기 참석 투표</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f4f6f8; margin: 0; padding: 16px; color: #333; }
    .card { background: #fff; border-radius: 12px; padding: 20px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    h2 { margin-top: 0; font-size: 1.2rem; color: #1a1a1a; }
    .info-group { margin-bottom: 8px; font-size: 0.95rem; }
    .label { font-weight: bold; color: #555; }
    select, input, button { width: 100%; padding: 10px; margin-top: 6px; border-radius: 6px; border: 1px solid #ccc; font-size: 0.95rem; }
    .btn-group { display: flex; gap: 8px; margin-top: 10px; }
    .btn-vote { flex: 1; padding: 12px; font-weight: bold; color: #fff; border: none; border-radius: 6px; cursor: pointer; }
    .btn-attend { background-color: #2e7d32; }
    .btn-absent { background-color: #c62828; }
    .list-box { font-size: 0.9rem; line-height: 1.5; background: #fafafa; padding: 10px; border-radius: 6px; }
    .comment-item { border-bottom: 1px solid #eee; padding: 8px 0; }
    .comment-header { display: flex; justify-content: space-between; font-size: 0.8rem; color: #777; margin-bottom: 4px; }
    .comment-actions button { width: auto; padding: 2px 6px; font-size: 0.75rem; margin-left: 4px; display: inline-block; }
  </style>
</head>
<body>

  <div class="card">
    <h2>⚽ AZFC 다음 경기 일정</h2>
    <div class="info-group"><span class="label">일시:</span> <span id="match-time">불러오는 중...</span></div>
    <div class="info-group"><span class="label">장소:</span> <span id="match-location">불러오는 중...</span></div>
  </div>

  <div class="card">
    <h2>내 정보 선택 및 투표</h2>
    <select id="user-select">
      <option value="">-- 이름을 선택하세요 --</option>
    </select>
    <div class="btn-group">
      <button class="btn-vote btn-attend" onclick="vote('참석')">참석</button>
      <button class="btn-vote btn-absent" onclick="vote('불참')">불참</button>
    </div>
  </div>

  <div class="card">
    <h2>투표 현황</h2>
    <p><strong>참석 (<span id="attend-count">0</span>명):</strong></p>
    <div class="list-box" id="attend-list">-</div>
    <p><strong>불참 (<span id="absent-count">0</span>명):</strong></p>
    <div class="list-box" id="absent-list">-</div>
    <p><strong>미투표 (<span id="unvoted-count">0</span>명):</strong></p>
    <div class="list-box" id="unvoted-list">-</div>
  </div>

  <div class="card">
    <h2>댓글 및 전달사항</h2>
    <input type="text" id="comment-input" placeholder="댓글을 입력하세요...">
    <button onclick="addComment()" style="background-color: #1976d2; color: #fff; border: none; margin-top: 8px; font-weight: bold;">댓글 등록</button>
    <div id="comment-list" style="margin-top: 16px;"></div>
  </div>

<script>
  const GAS_URL = "https://script.google.com/macros/s/YOUR_SCRIPT_ID/exec"; // 본인 스크립트 URL로 교체

  let currentMembers = {};
  let currentComments = [];

  function fetchData() {
    fetch(`${GAS_URL}?action=getData`)
      .then(res => res.json())
      .then(data => {
        if (!data.success) return;
        
        document.getElementById('match-time').innerText = data.time;
        document.getElementById('match-location').innerText = data.location;
        currentMembers = data.members;
        
        // 회원 드롭다운 채우기
        const select = document.getElementById('user-select');
        const selectedVal = select.value;
        select.innerHTML = '<option value="">-- 이름을 선택하세요 --</option>';
        for (let email in data.members) {
          const opt = document.createElement('option');
          opt.value = email;
          opt.innerText = data.members[email];
          select.appendChild(opt);
        }
        select.value = selectedVal;

        // 투표 현황 렌더링
        document.getElementById('attend-count').innerText = data.attendees.length;
        document.getElementById('attend-list').innerText = data.attendees.join(', ') || '없음';
        
        document.getElementById('absent-count').innerText = data.absentees.length;
        document.getElementById('absent-list').innerText = data.absentees.join(', ') || '없음';

        const votedEmails = [...data.attendeeEmails, ...data.absenteeEmails];
        const unvoted = [];
        for (let email in data.members) {
          if (!votedEmails.includes(email)) {
            unvoted.push(data.members[email]);
          }
        }
        document.getElementById('unvoted-count').innerText = unvoted.length;
        document.getElementById('unvoted-list').innerText = unvoted.join(', ') || '없음';

        // 댓글 렌더링
        currentComments = data.comments || [];
        renderComments();
      });
  }

  function vote(status) {
    const email = document.getElementById('user-select').value;
    if (!email) return alert('이름을 선택해주세요.');
    
    fetch(`${GAS_URL}?action=vote&email=${encodeURIComponent(email)}&status=${encodeURIComponent(status)}`)
      .then(res => res.json())
      .then(res => {
        if (res.success) fetchData();
        else alert(res.message || '투표 실패');
      });
  }

  function addComment() {
    const email = document.getElementById('user-select').value;
    const text = document.getElementById('comment-input').value.trim();
    if (!email) return alert('이름을 먼저 선택해주세요.');
    if (!text) return alert('내용을 입력해주세요.');

    fetch(`${GAS_URL}?action=addComment&email=${encodeURIComponent(email)}&comment=${encodeURIComponent(text)}`)
      .then(res => res.json())
      .then(res => {
        if (res.success) {
          document.getElementById('comment-input').value = '';
          fetchData();
        } else {
          alert(res.message);
        }
      });
  }

  function editComment(id, oldText) {
    const email = document.getElementById('user-select').value;
    if (!email) return alert('수정하려면 이름(본인 계정)을 먼저 선택해주세요.');
    
    const newText = prompt('댓글 수정:', oldText);
    if (!newText || newText === oldText) return;

    fetch(`${GAS_URL}?action=editComment&email=${encodeURIComponent(email)}&commentId=${id}&comment=${encodeURIComponent(newText)}`)
      .then(res => res.json())
      .then(res => {
        if (res.success) fetchData();
        else alert(res.message);
      });
  }

  function deleteComment(id) {
    const email = document.getElementById('user-select').value;
    if (!email) return alert('삭제하려면 이름(본인 계정)을 먼저 선택해주세요.');
    if (!confirm('정말 삭제하시겠습니까?')) return;

    fetch(`${GAS_URL}?action=deleteComment&email=${encodeURIComponent(email)}&commentId=${id}`)
      .then(res => res.json())
      .then(res => {
        if (res.success) fetchData();
        else alert(res.message);
      });
  }

  function renderComments() {
    const container = document.getElementById('comment-list');
    const selectedEmail = document.getElementById('user-select').value.toLowerCase();
    container.innerHTML = '';

    currentComments.forEach(c => {
      const name = currentMembers[c.email] || c.email;
      const isOwner = c.email.toLowerCase() === selectedEmail;

      const item = document.createElement('div');
      item.className = 'comment-item';
      item.innerHTML = `
        <div class="comment-header">
          <strong>${name}</strong> (${c.timestamp})
          ${isOwner ? `
            <span class="comment-actions">
              <button onclick="editComment('${c.id}', '${c.text.replace(/'/g, "\\'")}')">수정</button>
              <button onclick="deleteComment('${c.id}')">삭제</button>
            </span>
          ` : ''}
        </div>
        <div>${c.text}</div>
      `;
      container.appendChild(item);
    });
  }

  document.getElementById('user-select').addEventListener('change', renderComments);
  fetchData();
</script>

</body>
</html>
