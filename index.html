<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AZFC 축구 모임 투표</title>
  
  <!-- Google Identity Services SDK -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --accent-color: #00e676;
      --text-color: #ffffff;
      --text-sub: #b0b0b0;
      --border-color: #333333;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      padding: 20px 12px;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .card {
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 20px;
      border: 1px solid var(--border-color);
    }

    h1 {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--accent-color);
      margin-bottom: 12px;
    }

    .match-info p {
      font-size: 0.95rem;
      color: var(--text-sub);
      margin-bottom: 6px;
    }

    .login-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding: 16px 0;
    }

    .user-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.9rem;
      color: var(--accent-color);
    }

    .vote-btns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 12px;
    }

    button {
      background-color: #2a2a2a;
      color: var(--text-color);
      border: 1px solid var(--border-color);
      padding: 12px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover {
      background-color: #3a3a3a;
    }

    button.active {
      background-color: var(--accent-color);
      color: #000;
      border-color: var(--accent-color);
    }

    .admin-section {
      margin-top: 24px;
      border-top: 1px dashed var(--border-color);
      padding-top: 16px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 12px;
    }

    input {
      background-color: #2a2a2a;
      border: 1px solid var(--border-color);
      color: #fff;
      padding: 10px;
      border-radius: 6px;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- 경기 정보 -->
    <div class="card">
      <h1>AZFC 경기 투표</h1>
      <div class="match-info">
        <p>🗓 일시: <span id="match-time">로딩 중...</span></p>
        <p>📍 장소: <span id="match-location">로딩 중...</span></p>
      </div>
    </div>

    <!-- 구글 로그인 / 투표 영역 -->
    <div class="card" id="auth-card">
      <div id="logged-out-view" class="login-box">
        <p style="font-size: 0.9rem; color: var(--text-sub);">투표에 참여하려면 구글 계정으로 로그인해 주세요.</p>
        <div id="google-login-btn"></div>
      </div>

      <div id="logged-in-view" class="hidden">
        <div class="user-info">
          <span id="user-email-display">user@example.com</span>
          <button onclick="logout()" style="padding: 4px 8px; font-size: 0.8rem;">로그아웃</button>
        </div>
        
        <div class="vote-btns">
          <button id="btn-attend" onclick="submitVote('참석')">참석</button>
          <button id="btn-absent" onclick="submitVote('불참')">불참</button>
        </div>
      </div>
    </div>

    <!-- 투표 현황 -->
    <div class="card">
      <h2 style="font-size: 1.1rem; margin-bottom: 10px;">투표 현황</h2>
      <div style="font-size: 0.95rem; color: var(--text-sub); line-height: 1.6;">
        <p>🟢 참석 (<span id="attend-count">0</span>명): <span id="attend-list">-</span></p>
        <p style="margin-top: 6px;">🔴 불참 (<span id="absent-count">0</span>명): <span id="absent-list">-</span></p>
      </div>
    </div>

    <!-- 관리자 기능 -->
    <div class="card admin-section">
      <h2 style="font-size: 1rem; color: var(--text-sub); margin-bottom: 10px;">관리자 설정</h2>
      <div class="input-group">
        <input type="password" id="admin-pw" placeholder="관리자 비밀번호">
        <input type="text" id="new-match-time" placeholder="새 경기 일시">
        <input type="text" id="new-match-loc" placeholder="새 경기 장소">
        <button onclick="updateMatchInfo()">일정 업데이트</button>
        <button onclick="resetVotes()" style="background-color: #cf6679; color: #000;">투표 초기화</button>
      </div>
    </div>
  </div>

  <script>
    // ================= CONFIGURATION =================
    const GOOGLE_CLIENT_ID = "77918384297-tbu1ip01281v3m4rqfpj19f8thhclk68.apps.googleusercontent.com";
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzhcMkEcuUCp06vpCihsLek-ou7bYOUiYDArFaVjEwXS24nsjy1eGy80nW5STJl5Rs4fA/exec";
    // =================================================

    let currentUserEmail = "";

    window.onload = function() {
      initGoogleLogin();
      fetchData();
    };

    function initGoogleLogin() {
      if (typeof google === 'undefined' || !google.accounts) {
        setTimeout(initGoogleLogin, 200);
        return;
      }

      google.accounts.id.initialize({
        client_id: GOOGLE_CLIENT_ID,
        callback: handleCredentialResponse,
        use_fedcm_for_prompt: false,
        auto_select: false
      });

      google.accounts.id.renderButton(
        document.getElementById("google-login-btn"),
        { 
          theme: "outline", 
          size: "large", 
          type: "standard",
          shape: "pill",
          text: "signin_with"
        }
      );
    }

    function handleCredentialResponse(response) {
      try {
        const responsePayload = parseJwt(response.credential);
        currentUserEmail = responsePayload.email;
        
        document.getElementById("user-email-display").innerText = currentUserEmail;
        document.getElementById("logged-out-view").classList.add("hidden");
        document.getElementById("logged-in-view").classList.remove("hidden");
        
        fetchData();
      } catch (e) {
        console.error("로그인 토큰 파싱 에러:", e);
        alert("로그인 처리 중 오류가 발생했습니다.");
      }
    }

    function parseJwt(token) {
      const base64Url = token.split('.')[1];
      const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
      const jsonPayload = decodeURIComponent(window.atob(base64).split('').map(function(c) {
          return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
      }).join(''));
      return JSON.parse(jsonPayload);
    }

    function logout() {
      currentUserEmail = "";
      document.getElementById("logged-in-view").classList.add("hidden");
      document.getElementById("logged-out-view").classList.remove("hidden");
      document.getElementById("btn-attend").classList.remove("active");
      document.getElementById("btn-absent").classList.remove("active");
    }

    function fetchData() {
      fetch(SCRIPT_URL)
        .then(res => res.json())
        .then(data => {
          document.getElementById("match-time").innerText = data.time || "미정";
          document.getElementById("match-location").innerText = data.location || "미정";

          const attendList = data.attendees || [];
          const absentList = data.absentees || [];
          const attendEmails = data.attendeeEmails || [];
          const absentEmails = data.absenteeEmails || [];

          // 화면 현황 목록에는 A열(이름) 표시
          document.getElementById("attend-count").innerText = attendList.length;
          document.getElementById("attend-list").innerText = attendList.join(", ") || "-";

          document.getElementById("absent-count").innerText = absentList.length;
          document.getElementById("absent-list").innerText = absentList.join(", ") || "-";

          // 본인 버튼 활성화 여부는 B열(이메일)로 판별
          if (currentUserEmail) {
            document.getElementById("btn-attend").classList.toggle("active", attendEmails.includes(currentUserEmail));
            document.getElementById("btn-absent").classList.toggle("active", absentEmails.includes(currentUserEmail));
          }
        })
        .catch(err => console.error("데이터 동기화 실패:", err));
    }

    function submitVote(status) {
      if (!currentUserEmail) {
        alert("로그인이 필요합니다.");
        return;
      }

      sendRequest({
        action: "vote",
        email: currentUserEmail,
        status: status
      });
    }

    function updateMatchInfo() {
      const pw = document.getElementById("admin-pw").value;
      const newTime = document.getElementById("new-match-time").value;
      const newLoc = document.getElementById("new-match-loc").value;

      if (!pw || !newTime || !newLoc) {
        alert("비밀번호, 일시, 장소를 모두 입력하세요.");
        return;
      }

      sendRequest({
        action: "updateInfo",
        password: pw,
        time: newTime,
        location: newLoc
      });
    }

    function resetVotes() {
      const pw = document.getElementById("admin-pw").value;
      if (!pw) {
        alert("비밀번호를 입력하세요.");
        return;
      }

      if (confirm("정말로 모든 투표 데이터를 초기화하시겠습니까?")) {
        sendRequest({
          action: "resetVotes",
          password: pw
        });
      }
    }

    function sendRequest(payload) {
      fetch(SCRIPT_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload)
      })
      .then(res => res.json())
      .then(res => {
        if (res.success) {
          alert("처리되었습니다.");
          fetchData();
        } else {
          alert("오류: " + (res.message || "처리에 실패했습니다."));
        }
      })
      .catch(err => {
        console.error("요청 오류:", err);
        alert("서버 통신 중 오류가 발생했습니다.");
      });
    }
  </script>
</body>
</html>
