<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AZFC Match Schedule & RSVP</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --primary-color: #3b82f6;
      --primary-hover: #2563eb;
      --success-color: #10b981;
      --success-bg: rgba(16, 185, 129, 0.12);
      --danger-color: #ef4444;
      --danger-bg: rgba(239, 68, 68, 0.12);
      --warning-color: #f59e0b;
    }

    * { box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 24px 16px;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 640px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 28px 20px;
      border-radius: 20px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }

    .header-section {
      text-align: center;
      margin-bottom: 24px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--card-border);
    }

    h1 { font-size: 24px; font-weight: 800; margin: 0 0 16px 0; }

    .user-info {
      font-size: 14px;
      color: var(--text-sub);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .user-name { color: var(--primary-color); font-weight: 700; }

    .btn-logout {
      background-color: #334155;
      color: #cbd5e1;
      padding: 6px 14px;
      font-size: 13px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    .info-card {
      background-color: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--card-border);
      padding: 18px 20px;
      border-radius: 14px;
      margin-bottom: 24px;
    }

    .info-item { margin: 8px 0; font-size: 15px; }
    .info-item strong { color: var(--primary-color); }

    .vote-buttons { display: flex; gap: 12px; margin-bottom: 28px; }

    .btn-vote {
      flex: 1;
      padding: 18px 12px;
      font-size: 18px;
      font-weight: 700;
      border-radius: 14px;
      cursor: pointer;
      border: 2px solid transparent;
      transition: all 0.2s ease;
    }

    .btn-attend {
      color: var(--success-color);
      border-color: rgba(16, 185, 129, 0.3);
      background-color: var(--success-bg);
    }
    .btn-attend:hover, .btn-attend.active {
      background-color: var(--success-color);
      color: #ffffff;
    }

    .btn-absent {
      color: var(--danger-color);
      border-color: rgba(239, 68, 68, 0.3);
      background-color: var(--danger-bg);
    }
    .btn-absent:hover, .btn-absent.active {
      background-color: var(--danger-color);
      color: #ffffff;
    }

    .results-section {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 24px;
    }

    .result-box {
      background-color: rgba(15, 23, 42, 0.5);
      border: 1px solid var(--card-border);
      padding: 14px 10px;
      border-radius: 12px;
      text-align: center;
    }

    .result-box h3 { margin: 0 0 10px 0; font-size: 13px; font-weight: 700; }
    .result-box.attend-box h3 { color: var(--success-color); }
    .result-box.absent-box h3 { color: var(--danger-color); }
    .result-box.unvoted-box h3 { color: var(--warning-color); }

    .member-list {
      font-size: 13px;
      max-height: 200px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .member-item {
      background-color: #0f172a;
      padding: 8px;
      border-radius: 6px;
      border: 1px solid var(--card-border);
    }

    .empty-msg { color: #64748b; font-size: 13px; }

    /* Comments */
    .comments-section {
      background-color: rgba(15, 23, 42, 0.5);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 20px;
    }

    .comment-form { display: flex; gap: 8px; margin-bottom: 14px; }
    .comment-form input {
      flex: 1;
      background-color: #0f172a;
      border: 1px solid var(--card-border);
      color: #fff;
      padding: 10px 12px;
      border-radius: 8px;
      outline: none;
    }

    .btn-comment {
      background-color: var(--primary-color);
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }

    .comments-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 220px;
      overflow-y: auto;
    }

    .comment-item {
      background-color: #0f172a;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 13px;
    }

    .comment-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 4px;
      font-size: 11px;
    }

    .comment-author { font-weight: 700; color: var(--primary-color); }
    .comment-time { color: #64748b; }
    .comment-text { color: #cbd5e1; word-break: break-word; }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div class="container">
    <div class="header-section">
      <h1>⚽ AZFC Match Schedule & RSVP</h1>
      
      <div id="logged-out-view">
        <p style="color: var(--text-sub); margin-bottom: 16px; font-size: 14px;">Please sign in with Google to vote and comment.</p>
        <div id="google-login-btn" style="display: flex; justify-content: center;"></div>
      </div>

      <div id="logged-in-view" class="user-info hidden">
        <span>Welcome, <span id="user-display-name" class="user-name"></span>!</span>
        <button class="btn-logout" onclick="logout()">Sign Out</button>
      </div>
    </div>

    <div class="info-card">
      <div class="info-item">📅 <strong>Date & Time:</strong> <span id="match-time">Loading...</span></div>
      <div class="info-item">📍 <strong>Location:</strong> <span id="match-location">Monta Vista High School</span></div>
    </div>

    <div class="vote-buttons">
      <button id="btn-attend" class="btn-vote btn-attend" onclick="submitVote('참석')">Attending</button>
      <button id="btn-absent" class="btn-vote btn-absent" onclick="submitVote('불참')">Not Attending</button>
    </div>

    <div class="results-section">
      <div class="result-box attend-box">
        <h3>Attending (<span id="attend-count">0</span>)</h3>
        <div id="attend-list" class="member-list"><div class="empty-msg">-</div></div>
      </div>
      <div class="result-box absent-box">
        <h3>Not Attending (<span id="absent-count">0</span>)</h3>
        <div id="absent-list" class="member-list"><div class="empty-msg">-</div></div>
      </div>
      <div class="result-box unvoted-box">
        <h3>Pending (<span id="unvoted-count">0</span>)</h3>
        <div id="unvoted-list" class="member-list"><div class="empty-msg">-</div></div>
      </div>
    </div>

    <div class="comments-section">
      <h3 style="margin:0 0 12px 0; font-size:15px;">💬 Match Discussion</h3>
      <div class="comment-form">
        <input type="text" id="comment-input" placeholder="Leave a comment..." onkeypress="handleCommentKeyPress(event)">
        <button class="btn-comment" id="btn-comment-submit" onclick="submitComment()">Post</button>
      </div>
      <div id="comments-list" class="comments-list">
        <div class="empty-msg" style="text-align: center;">No comments yet.</div>
      </div>
    </div>
  </div>

  <script>
    const GOOGLE_CLIENT_ID = "77918384297-tbu1ip01281v3m4rqfpj19f8thhclk68.apps.googleusercontent.com";
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzCzx51uUeK7qGl-FDDm7W04j4tgG2BtGfwDufneew-BjLYmFr7Sy1YtPYYB3t5TEuS/exec";

    let currentUserEmail = "";
    let memberMap = {};

    window.onload = function() {
      initGoogleLogin();
      fetchData();
    };

    function initGoogleLogin() {
      if (typeof google === 'undefined' || !google.accounts) {
        setTimeout(initGoogleLogin, 200);
        return;
      }

      google.accounts.id.initialize({
        client_id: GOOGLE_CLIENT_ID,
        callback: handleCredentialResponse,
        use_fedcm_for_prompt: false,
        auto_select: false
      });

      google.accounts.id.renderButton(
        document.getElementById("google-login-btn"),
        { theme: "filled_black", size: "large", type: "standard", shape: "pill", text: "signin_with" }
      );
    }

    function handleCredentialResponse(response) {
      try {
        const responsePayload = parseJwt(response.credential);
        currentUserEmail = (responsePayload.email || "").toLowerCase().trim();
        
        document.getElementById("logged-out-view").classList.add("hidden");
        document.getElementById("logged-in-view").classList.remove("hidden");
        
        updateUserHeaderName();
        fetchData();
      } catch (e) {
        alert("Authentication failed.");
      }
    }

    function logout() {
      currentUserEmail = "";
      document.getElementById("logged-out-view").classList.remove("hidden");
      document.getElementById("logged-in-view").classList.add("hidden");
      document.getElementById("btn-attend").classList.remove("active");
      document.getElementById("btn-absent").classList.remove("active");
    }

    function parseJwt(token) {
      const base64Url = token.split('.')[1];
      const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
      const jsonPayload = decodeURIComponent(window.atob(base64).split('').map(function(c) {
          return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
      }).join(''));
      return JSON.parse(jsonPayload);
    }

    function updateUserHeaderName() {
      if (!currentUserEmail) return;
      const displayName = memberMap[currentUserEmail] || (currentUserEmail + " (Unregistered)");
      document.getElementById("user-display-name").textContent = displayName;
    }

    function renderMemberList(elementId, namesArray) {
      const container = document.getElementById(elementId);
      container.innerHTML = "";

      if (!namesArray || namesArray.length === 0) {
        container.innerHTML = '<div class="empty-msg">-</div>';
        return;
      }

      namesArray.forEach(name => {
        const itemDiv = document.createElement("div");
        itemDiv.className = "member-item";
        itemDiv.textContent = name;
        container.appendChild(itemDiv);
      });
    }

    function renderComments(commentsArray) {
      const container = document.getElementById("comments-list");
      container.innerHTML = "";

      if (!commentsArray || commentsArray.length === 0) {
        container.innerHTML = '<div class="empty-msg" style="text-align: center;">No comments yet.</div>';
        return;
      }

      commentsArray.forEach(item => {
        const card = document.createElement("div");
        card.className = "comment-item";
        const authorName = memberMap[item.email?.toLowerCase().trim()] || item.email || "Anonymous";
        
        card.innerHTML = `
          <div class="comment-header">
            <span class="comment-author">${escapeHtml(authorName)}</span>
            <span class="comment-time">${escapeHtml(item.timestamp || '')}</span>
          </div>
          <div class="comment-text">${escapeHtml(item.text)}</div>
        `;
        container.appendChild(card);
      });
    }

    function escapeHtml(text) {
      if (!text) return "";
      return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    function fetchData() {
      const url = SCRIPT_URL + "?action=getData&t=" + new Date().getTime();
      fetch(url)
        .then(res => res.json())
        .then(data => {
          if (!data.success) return;

          document.getElementById("match-time").textContent = data.time || "TBD";
          document.getElementById("match-location").textContent = data.location || "Monta Vista High School";

          if (data.members) {
            memberMap = data.members;
            updateUserHeaderName();
          }

          const attendList = data.attendees || [];
          const absentList = data.absentees || [];
          const attendEmails = (data.attendeeEmails || []).map(e => e.toLowerCase().trim());
          const absenteeEmails = (data.absenteeEmails || []).map(e => e.toLowerCase().trim());

          document.getElementById("attend-count").textContent = attendList.length;
          document.getElementById("absent-count").textContent = absentList.length;

          renderMemberList("attend-list", attendList);
          renderMemberList("absent-list", absentList);

          const votedEmails = new Set([...attendEmails, ...absenteeEmails]);
          const unvotedList = [];

          for (const email in memberMap) {
            if (!votedEmails.has(email)) {
              unvotedList.push(memberMap[email]);
            }
          }

          document.getElementById("unvoted-count").textContent = unvotedList.length;
          renderMemberList("unvoted-list", unvotedList);

          if (currentUserEmail) {
            document.getElementById("btn-attend").classList.toggle("active", attendEmails.includes(currentUserEmail));
            document.getElementById("btn-absent").classList.toggle("active", absenteeEmails.includes(currentUserEmail));
          }

          renderComments(data.comments || []);
        })
        .catch(err => console.error("Data load failed:", err));
    }

    function submitVote(status) {
      if (!currentUserEmail) {
        alert("Sign in required.");
        return;
      }
      sendRequest({ action: "vote", email: currentUserEmail, status: status });
    }

    function handleCommentKeyPress(event) {
      if (event.key === 'Enter') submitComment();
    }

    function submitComment() {
      if (!currentUserEmail) {
        alert("Sign in required.");
        return;
      }

      const input = document.getElementById("comment-input");
      const text = input.value.trim();

      if (!text) {
        alert("Please enter a comment.");
        return;
      }

      const btn = document.getElementById("btn-comment-submit");
      btn.disabled = true;

      sendRequest({
        action: "addComment",
        email: currentUserEmail,
        comment: text
      }, () => {
        input.value = "";
        btn.disabled = false;
      });
    }

    function sendRequest(params, onSuccess) {
      params.t = new Date().getTime();
      const queryString = new URLSearchParams(params).toString();
      
      fetch(SCRIPT_URL + "?" + queryString, {
        method: "GET",
        mode: "cors",
        redirect: "follow"
      })
        .then(res => res.json())
        .then(res => {
          if (res.success) {
            fetchData();
            if (onSuccess) onSuccess();
          } else {
            alert("Error: " + (res.message || "Operation failed."));
          }
        })
        .catch(err => {
          console.error(err);
          alert("Request failed. Network error.");
        });
    }
  </script>
</body>
</html>
