<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AZFC Match Schedule & Attendance Vote</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --card-border: #2d2d2d;
      --text-main: #f0f0f0;
      --text-sub: #aaaaaa;
      --primary-color: #3b82f6;
      --success-color: #10b981;
      --success-bg: rgba(16, 185, 129, 0.15);
      --danger-color: #ef4444;
      --danger-bg: rgba(239, 68, 68, 0.15);
      --warning-color: #f59e0b;
      --warning-bg: rgba(245, 158, 11, 0.15);
    }

    * { box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 24px 16px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 640px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 32px 24px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .header-section {
      text-align: center;
      margin-bottom: 28px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--card-border);
    }

    h1 {
      font-size: 26px;
      margin: 0 0 16px 0;
      letter-spacing: -0.5px;
    }

    .user-info {
      font-size: 15px;
      color: var(--text-sub);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .user-name {
      color: var(--primary-color);
      font-weight: 700;
    }

    .btn-logout {
      background-color: #333;
      color: #bbb;
      padding: 6px 12px;
      font-size: 13px;
      border: 1px solid #444;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-logout:hover { background-color: #444; color: #fff; }

    /* Match Info Card */
    .info-card {
      background-color: #262626;
      border: 1px solid #333;
      padding: 20px;
      border-radius: 14px;
      margin-bottom: 28px;
    }

    .info-item {
      margin: 10px 0;
      font-size: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .info-item:first-child { margin-top: 0; }
    .info-item:last-child { margin-bottom: 0; }

    .info-item strong {
      color: var(--primary-color);
      min-width: 80px;
    }

    /* Voting Buttons */
    .vote-buttons {
      display: flex;
      gap: 16px;
      margin-bottom: 32px;
    }

    .btn-vote {
      flex: 1;
      padding: 22px 16px;
      font-size: 20px;
      font-weight: 800;
      border-radius: 16px;
      cursor: pointer;
      border: 2px solid transparent;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      background-color: #2a2a2a;
    }

    .btn-attend {
      color: var(--success-color);
      border-color: rgba(16, 185, 129, 0.4);
      background-color: var(--success-bg);
    }
    .btn-attend:hover, .btn-attend.active {
      background-color: var(--success-color);
      color: #ffffff;
      border-color: var(--success-color);
      box-shadow: 0 0 20px rgba(16, 185, 129, 0.4);
      transform: translateY(-2px);
    }

    .btn-absent {
      color: var(--danger-color);
      border-color: rgba(239, 68, 68, 0.4);
      background-color: var(--danger-bg);
    }
    .btn-absent:hover, .btn-absent.active {
      background-color: var(--danger-color);
      color: #ffffff;
      border-color: var(--danger-color);
      box-shadow: 0 0 20px rgba(239, 68, 68, 0.4);
      transform: translateY(-2px);
    }

    /* Roster Lists (3 Columns) */
    .results-section {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 32px;
    }

    .result-box {
      background-color: #242424;
      border: 1px solid var(--card-border);
      padding: 16px 12px;
      border-radius: 12px;
      text-align: center;
    }

    .result-box h3 {
      margin: 0 0 12px 0;
      font-size: 14px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .result-box.attend-box h3 { color: var(--success-color); }
    .result-box.absent-box h3 { color: var(--danger-color); }
    .result-box.unvoted-box h3 { color: var(--warning-color); }

    .member-list {
      font-size: 14px;
      color: #ccc;
      max-height: 220px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 0 2px;
    }

    .member-item {
      background-color: #1a1a1a;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid #333;
      text-align: center;
      word-break: break-all;
      font-weight: 500;
    }

    .empty-msg {
      color: #666;
      font-size: 13px;
      padding: 8px 0;
    }

    /* Admin Section */
    .admin-section {
      padding-top: 24px;
      border-top: 1px dashed var(--card-border);
    }

    .admin-section h3 {
      font-size: 15px;
      color: var(--text-sub);
      margin-bottom: 14px;
      text-align: left;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .admin-form {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .admin-form input {
      background-color: #181818;
      border: 1px solid #333;
      color: #fff;
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
    }
    .admin-form input:focus { border-color: var(--primary-color); }

    .admin-btn-group {
      display: flex;
      gap: 10px;
    }

    .admin-form button {
      flex: 1;
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      border: none;
      transition: background-color 0.2s;
    }

    .btn-update { background-color: var(--primary-color); color: white; }
    .btn-update:hover { background-color: #2563eb; }

    .btn-reset { background-color: #333; color: var(--danger-color); border: 1px solid var(--danger-color) !important; }
    .btn-reset:hover { background-color: var(--danger-color); color: white; }

    .hidden { display: none !important; }

    @media (max-width: 480px) {
      .results-section {
        grid-template-columns: 1fr;
      }
      .btn-vote {
        padding: 18px 12px;
        font-size: 18px;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header-section">
      <h1>⚽ AZFC Match Schedule & RSVP</h1>
      
      <div id="logged-out-view">
        <p style="color: var(--text-sub); margin-bottom: 16px;">Please sign in with Google to vote.</p>
        <div id="google-login-btn" style="display: flex; justify-content: center;"></div>
      </div>

      <div id="logged-in-view" class="user-info hidden">
        <span>Welcome, <span id="user-display-name" class="user-name"></span>!</span>
        <button class="btn-logout" onclick="logout()">Sign Out</button>
      </div>
    </div>

    <div class="info-card">
      <div class="info-item">📅 <strong>Date & Time:</strong> <span id="match-time">Loading...</span></div>
      <div class="info-item">📍 <strong>Location:</strong> <span id="match-location">Loading...</span></div>
    </div>

    <div class="vote-buttons">
      <button id="btn-attend" class="btn-vote btn-attend" onclick="submitVote('참석')">
        <span>Attending</span>
      </button>
      <button id="btn-absent" class="btn-vote btn-absent" onclick="submitVote('불참')">
        <span>Not Attending</span>
      </button>
    </div>

    <div class="results-section">
      <div class="result-box attend-box">
        <h3>Attending (<span id="attend-count">0</span>)</h3>
        <div id="attend-list" class="member-list"><div class="empty-msg">-</div></div>
      </div>
      <div class="result-box absent-box">
        <h3>Not Attending (<span id="absent-count">0</span>)</h3>
        <div id="absent-list" class="member-list"><div class="empty-msg">-</div></div>
      </div>
      <div class="result-box unvoted-box">
        <h3>Pending (<span id="unvoted-count">0</span>)</h3>
        <div id="unvoted-list" class="member-list"><div class="empty-msg">-</div></div>
      </div>
    </div>

    <div class="admin-section">
      <h3>⚙️ Admin Controls</h3>
      <div class="admin-form">
        <input type="password" id="admin-pw" placeholder="Admin Password">
        <input type="text" id="new-match-time" placeholder="New Schedule (e.g., Sat Oct 24, 6:00 PM)">
        <input type="text" id="new-match-loc" placeholder="New Location (e.g., Central Park Pitch #1)">
        <div class="admin-btn-group">
          <button class="btn-update" onclick="updateMatchInfo()">Update Schedule</button>
          <button class="btn-reset" onclick="resetVotes()">Reset Votes</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const GOOGLE_CLIENT_ID = "77918384297-tbu1ip01281v3m4rqfpj19f8thhclk68.apps.googleusercontent.com";
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzCzx51uUeK7qGl-FDDm7W04j4tgG2BtGfwDufneew-BjLYmFr7Sy1YtPYYB3t5TEuS/exec";

    let currentUserEmail = "";
    let memberMap = {};

    window.onload = function() {
      initGoogleLogin();
      fetchData();
    };

    function initGoogleLogin() {
      if (typeof google === 'undefined' || !google.accounts) {
        setTimeout(initGoogleLogin, 200);
        return;
      }

      google.accounts.id.initialize({
        client_id: GOOGLE_CLIENT_ID,
        callback: handleCredentialResponse,
        use_fedcm_for_prompt: false,
        auto_select: false
      });

      google.accounts.id.renderButton(
        document.getElementById("google-login-btn"),
        { theme: "filled_black", size: "large", type: "standard", shape: "pill", text: "signin_with" }
      );
    }

    function handleCredentialResponse(response) {
      try {
        const responsePayload = parseJwt(response.credential);
        currentUserEmail = (responsePayload.email || "").toLowerCase().trim();
        
        document.getElementById("logged-out-view").classList.add("hidden");
        document.getElementById("logged-in-view").classList.remove("hidden");
        
        updateUserHeaderName();
        fetchData();
      } catch (e) {
        alert("An error occurred during authentication.");
      }
    }

    function parseJwt(token) {
      const base64Url = token.split('.')[1];
      const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
      const jsonPayload = decodeURIComponent(window.atob(base64).split('').map(function(c) {
          return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
      }).join(''));
      return JSON.parse(jsonPayload);
    }

    function updateUserHeaderName() {
      if (!currentUserEmail) return;
      const displayName = memberMap[currentUserEmail] || (currentUserEmail + " (Unregistered)");
      document.getElementById("user-display-name").textContent = displayName;
    }

    function renderMemberList(elementId, namesArray) {
      const container = document.getElementById(elementId);
      container.innerHTML = "";

      if (!namesArray || namesArray.length === 0) {
        const emptyDiv = document.createElement("div");
        emptyDiv.className = "empty-msg";
        emptyDiv.textContent = "-";
        container.appendChild(emptyDiv);
        return;
      }

      namesArray.forEach(name => {
        const itemDiv = document.createElement("div");
        itemDiv.className = "member-item";
        itemDiv.textContent = name;
        container.appendChild(itemDiv);
      });
    }

    function fetchData() {
      const url = SCRIPT_URL + "?action=getData&t=" + new Date().getTime();
      fetch(url)
        .then(res => res.json())
        .then(data => {
          if (!data.success) {
            console.error("Server error:", data.message);
            return;
          }

          document.getElementById("match-time").textContent = data.time || "TBD";
          document.getElementById("match-location").textContent = data.location || "TBD";

          if (data.members) {
            memberMap = data.members;
            updateUserHeaderName();
          }

          const attendList = data.attendees || [];
          const absentList = data.absentees || [];
          const attendEmails = (data.attendeeEmails || []).map(e => e.toLowerCase().trim());
          const absenteeEmails = (data.absenteeEmails || []).map(e => e.toLowerCase().trim());

          document.getElementById("attend-count").textContent = attendList.length;
          document.getElementById("absent-count").textContent = absentList.length;

          renderMemberList("attend-list", attendList);
          renderMemberList("absent-list", absentList);

          const votedEmails = new Set([...attendEmails, ...absenteeEmails]);
          const unvotedList = [];

          for (const email in memberMap) {
            if (!votedEmails.has(email)) {
              unvotedList.push(memberMap[email]);
            }
          }

          document.getElementById("unvoted-count").textContent = unvotedList.length;
          renderMemberList("unvoted-list", unvotedList);

          if (currentUserEmail) {
            document.getElementById("btn-attend").classList.toggle("active", attendEmails.includes(currentUserEmail));
            document.getElementById("btn-absent").classList.toggle("active", absenteeEmails.includes(currentUserEmail));
          }
        })
        .catch(err => console.error("Failed to load data:", err));
    }

    function submitVote(status) {
      if (!currentUserEmail) {
        alert("Sign in required.");
        return;
      }

      sendRequest({
        action: "vote",
        email: currentUserEmail,
        status: status
      });
    }

    function updateMatchInfo() {
      const pw = document.getElementById("admin-pw").value;
      const newTime = document.getElementById("new-match-time").value;
      const newLoc = document.getElementById("new-match-loc").value;

      if (!pw || !newTime || !newLoc) {
        alert("Please enter the password, schedule, and location.");
        return;
      }

      sendRequest({
        action: "updateInfo",
        password: pw,
        time: newTime,
        location: newLoc
      });
    }

    function resetVotes() {
      const pw = document.getElementById("admin-pw").value;
      if (!pw) {
        alert("Please enter the admin password.");
        return;
      }

      if (confirm("Are you sure you want to reset all votes?")) {
        sendRequest({
          action: "resetVotes",
          password: pw
        });
      }
    }

    function sendRequest(params) {
      params.t = new Date().getTime();
      const queryString = new URLSearchParams(params).toString();
      
      fetch(SCRIPT_URL + "?" + queryString)
        .then(res => res.json())
        .then(res => {
          if (res.success) {
            alert("Updated successfully.");
            fetchData();
          } else {
            alert("Error: " + (res.message || "Unknown error occurred."));
          }
        })
        .catch(err => {
          console.error("Connection error:", err);
          alert("Network error. Please check your web app setup or permissions.");
        });
    }
  </script>
</body>
</html>
